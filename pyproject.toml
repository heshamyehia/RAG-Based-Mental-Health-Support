[project]
name = "rag-based-mental-health-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "groq>=1.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "torch>=2.12.0",
    "transformers>=5.9.0",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.15.14",
]

[tool.isort]
profile = "black"

[tool.ruff]
exclude = ["*.ipynb"]
